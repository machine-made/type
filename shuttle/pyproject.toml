[project]
name = "shuttle-loom"
version = "0.1.0"
description = "Generator for the machine-made Shuttle typeface."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fontmake==3.12.2",
    "fonttools==4.67.0",
    "ufoLib2==0.19.1",
    "skia-pathops==0.9.2",
    "pillow==13.0.0",
    "munkres==1.1.4",
    "brotli==1.2.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
# Only for tools/sketch_compare.py (not run in CI).
compare = ["playwright==1.63.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["loom"]
