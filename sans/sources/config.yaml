# gftools builder configuration for machine-made Sans.
# Run from the repository root: sans/scripts/build.sh
sources:
  - MachineMadeSans.glyphs
  - MachineMadeSans-Italic.glyphs
axisOrder:
  - wght
  - ital
familyName: "machine-made Sans"
outputDir: "../../build/sans"
buildWebfont: false
buildSmallCap: false
# Static TTF: ttfautohint (gftools default). Static OTF: otfautohint
# (afdko, see requirements-otf.txt). Variable fonts are not hinted
# (see sans/STATUS.md).
autohintTTF: true
autohintOTF: true
