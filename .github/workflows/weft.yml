name: weft

on:
  push:
    branches: [main]
    paths: ["weft/**", "fonts/weft/**", "proofs/weft/**", ".github/workflows/weft.yml"]
  pull_request:
    paths: ["weft/**", "fonts/weft/**", "proofs/weft/**", ".github/workflows/weft.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FONTSPECTOR_VERSION: "1.9.0"
  # SHA-256 of fontspector-1.9.0-x86_64-unknown-linux-gnu.tar.gz.
  FONTSPECTOR_SHA256: "0d4a7fbc577f7f99a084dec2a7acc13f64f923cbe44c0e3c5e3d76469786b8e2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: weft
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
          tesseract --version
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build fonts
        run: scripts/build.sh

      - name: Check interpolation (fontTools varLib.interpolatable)
        run: |
          fonttools varLib.interpolatable build/Weft.designspace
          fonttools varLib.interpolatable build/master/*.ufo
          fonttools varLib.interpolatable "../fonts/weft/variable/MachineMadeWeft[FRAG,wght].ttf"

      - name: Check that the committed fonts are current
        run: |
          if [ -n "$(git -C .. status --porcelain -- fonts/weft)" ]; then
            git -C .. status --short -- fonts/weft
            echo "::error::fonts/weft differs from a fresh build. Run weft/scripts/build.sh and commit the fonts."
            exit 1
          fi

      - name: Install Fontspector
        run: |
          name="fontspector-${FONTSPECTOR_VERSION}-x86_64-unknown-linux-gnu"
          curl -sSfL -o fontspector.tar.gz \
            "https://github.com/fonttools/fontspector/releases/download/fontspector-v${FONTSPECTOR_VERSION}/${name}.tar.gz"
          echo "${FONTSPECTOR_SHA256}  fontspector.tar.gz" | sha256sum --check
          tar xzf fontspector.tar.gz
          sudo install -m 755 "${name}/fontspector" /usr/local/bin/fontspector
          fontspector --version

      - name: Check fonts (Fontspector, universal profile)
        run: scripts/check.sh fontspector

      - name: Add check reports to the summary
        if: always()
        run: cat build/reports/*.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Readability gate (Tesseract OCR)
        run: python tools/readability.py --gate

      - name: Render proof sheets
        run: python tools/proof.py

      - name: Upload fonts, proofs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weft-0.1
          path: |
            fonts/weft/
            proofs/weft/
            weft/build/reports/
          if-no-files-found: warn
