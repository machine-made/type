name: site

# Build the specimen site (site/build.py) and deploy it to GitHub Pages.
# Pages source must be "GitHub Actions" (repo settings).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Weft page lists the latest commits.
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r site/requirements.txt

      # The site uses only the committed fonts in fonts/*/webfonts/ and the
      # report proofs/weft/readability.json. build.py has no stand-in fonts:
      # it stops with an error when a file is missing, so the deploy fails
      # and the live site stays as it is.
      - name: Build site
        run: python site/build.py

      - name: Check the built site
        run: |
          for f in "fonts/weft/MachineMadeWeft[FRAG,wght].woff2" "fonts/sans/MachineMadeSans[wght].woff2" \
                   "fonts/sans/MachineMadeSans-Italic[wght].woff2" "fonts/shuttle/MachineMadeShuttle[wdth,wght].woff2" \
                   data/readability.json data/shuttle.json index.html weft/index.html shuttle/index.html; do
            test -s "site/_site/$f" || { echo "::error::site/_site/$f is missing."; exit 1; }
          done
          python -c 'import json,sys; r=json.load(open("site/_site/data/readability.json")); sys.exit(0 if r.get("rows") else 1)'

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
